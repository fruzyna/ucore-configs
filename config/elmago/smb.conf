# See smb.conf.example for a more detailed config file or
# read the smb.conf manpage.
# Run 'testparm' to verify the config is correct after
# you modified it.
#
# Note:
# SMB1 is disabled by default. This means clients without support for SMB2 or
# SMB3 are no longer able to connect to smbd (by default).

[global]
	workgroup = WORKGROUP
	security = user

   # logging
   log file = /var/log/samba/log.%m
   max log size = 1000
   logging = file
   panic action = /usr/share/samba/panic-action %d

   # bind to any IP
   interfaces = lo enp2s0 wg0

   ####### Authentication #######

   server role = standalone server

   obey pam restrictions = yes

   # This boolean parameter controls whether Samba attempts to sync the Unix
   # password with the SMB password when the encrypted SMB password in the
   # passdb is changed.
   unix password sync = yes

   # For Unix password sync to work on a Debian GNU/Linux system, the following
   # parameters must be set (thanks to Ian Kahan <<kahan@informatik.tu-muenchen.de> for
   # sending the correct chat script for the passwd program in Debian Sarge).
   passwd program = /usr/bin/passwd %u
   passwd chat = *Enter\snew\s*\spassword:* %n\n *Retype\snew\s*\spassword:* %n\n *password\supdated\ssuccessfully* .

   # This boolean controls whether PAM will be used for password changes
   # when requested by an SMB client instead of the program listed in
   # 'passwd program'. The default is 'no'.
   pam password change = yes

   # This option controls how unsuccessful authentication attempts are mapped
   # to anonymous connections
   map to guest = bad user

   usershare allow guests = no

[crypt]
   comment = Encrypted Share
   path = /var/wrigley/crypt
   valid users = liam
   public = no
   writable = yes

[liam]
   comment = Liam's Archive
   path = /var/wrigley/liam
   valid users = liam
   public = no
   writable = yes

[ellen]
   comment = Ellen's Archive
   path = /var/wrigley/ellen
   valid users = liam ellen
   public = no
   writable = yes

[hass-backups]
   comment = Home Assistant Backups
   path = /var/wrigley/data/hass-backups
   valid users = liam
   public = no
   writable = yes
